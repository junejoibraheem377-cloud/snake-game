<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f172a;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }
  h1 { color: #34d399; margin: 0 0 4px 0; font-size: 24px; }
  #status { color: #cbd5e1; font-size: 14px; margin-bottom: 14px; }
  #board {
    background: #1e293b;
    border: 2px solid #34d399;
    border-radius: 8px;
    position: relative;
  }
  .snake-head {
    position: absolute;
    border-radius: 7px;
    background: linear-gradient(135deg, #4ade80, #16a34a);
    box-shadow: 0 0 5px rgba(34,197,94,0.7);
    z-index: 3;
  }
  .eye {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #0f172a;
    border-radius: 50%;
    z-index: 4;
  }
  .tongue {
    position: absolute;
    width: 2px;
    height: 6px;
    background: #ef4444;
    z-index: 2;
  }
  .snake-body {
    position: absolute;
    border-radius: 5px;
    background: linear-gradient(135deg, #22c55e, #15803d);
    border: 1px solid #0f5e2c;
  }
  .wall {
    position: absolute;
    background: #57534e;
    border: 1px solid #78716c;
    border-radius: 2px;
  }
  .fruit { position: absolute; border-radius: 50%; }
  .apple { background: radial-gradient(circle at 30% 30%, #fca5a5, #dc2626); }
  .apple::after {
    content: '';
    position: absolute;
    top: -4px; left: 45%;
    width: 2px; height: 5px;
    background: #4d7c0f;
  }
  .banana {
    background: linear-gradient(135deg, #fef08a, #eab308);
    border-radius: 40% 60% 60% 40%;
    transform: rotate(20deg);
  }
  .cherry { background: radial-gradient(circle at 30% 30%, #f9a8d4, #be123c); }
  .cherry::after {
    content: '';
    position: absolute;
    top: -5px; left: 45%;
    width: 2px; height: 6px;
    background: #22c55e;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,23,42,0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #gameOverText { color: #f87171; font-weight: 600; margin-bottom: 8px; }
  button.action {
    background: #10b981;
    color: #0f172a;
    border: none;
    padding: 10px 20px;
    font-weight: 700;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  button.action:active { background: #34d399; }
  #controls {
    display: grid;
    grid-template-columns: 50px 50px 50px;
    grid-template-rows: 50px 50px;
    gap: 8px;
    margin-top: 20px;
  }
  #controls button {
    background: #1e293b;
    color: #34d399;
    border: 1px solid #334155;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
  }
  #controls button:active { background: #334155; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #hint { color: #64748b; font-size: 12px; margin-top: 14px; text-align: center; }
  #legend { display:flex; gap:14px; margin-top:10px; font-size:12px; color:#94a3b8; flex-wrap: wrap; justify-content: center; }
  #legend span { display:flex; align-items:center; gap:4px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>
  <h1>🐍 Snake Game</h1>
  <div id="status">Score: 0 | High Score: 0</div>
  <div id="board">
    <div id="overlay">
      <button class="action" id="startBtn">Start Game</button>
    </div>
  </div>

  <div id="legend">
    <span><i class="dot" style="background:#dc2626"></i> Apple = 1pt</span>
    <span><i class="dot" style="background:#eab308"></i> Banana = 3pt</span>
    <span><i class="dot" style="background:#be123c"></i> Cherry = 5pt</span>
  </div>

  <div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <div id="hint">Arrow keys / WASD ya buttons se move karein. Walls se bachein!</div>

<script>
  const GRID_SIZE = 16;
  const CELL = 20;
  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');

  board.style.width = (GRID_SIZE * CELL) + 'px';
  board.style.height = (GRID_SIZE * CELL) + 'px';

  let snake, dir, nextDir, food, walls, score, highScore, running, loop;
  highScore = 0;

  const FRUIT_TYPES = [
    { type: 'apple', points: 1, weight: 60 },
    { type: 'banana', points: 3, weight: 30 },
    { type: 'cherry', points: 5, weight: 10 }
  ];

  function pickFruitType() {
    const total = FRUIT_TYPES.reduce((a, f) => a + f.weight, 0);
    let r = Math.random() * total;
    for (const f of FRUIT_TYPES) {
      if (r < f.weight) return f;
      r -= f.weight;
    }
    return FRUIT_TYPES[0];
  }

  function generateWalls() {
    const w = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      w.push({ x, y: 0 });
      w.push({ x, y: GRID_SIZE - 1 });
    }
    for (let y = 0; y < GRID_SIZE; y++) {
      w.push({ x: 0, y });
      w.push({ x: GRID_SIZE - 1, y });
    }
    for (let x = 6; x <= 9; x++) w.push({ x, y: 5 });
    for (let x = 6; x <= 9; x++) w.push({ x, y: 10 });
    return w;
  }

  function isBlocked(pos, snakeArr) {
    return walls.some(w => w.x === pos.x && w.y === pos.y) ||
           snakeArr.some(s => s.x === pos.x && s.y === pos.y);
  }

  function randomFood(snakeArr) {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
    } while (isBlocked(pos, snakeArr));
    const fruit = pickFruitType();
    return { x: pos.x, y: pos.y, type: fruit.type, points: fruit.points };
  }

  function render() {
    board.querySelectorAll('.snake-head, .snake-body, .fruit, .eye, .tongue, .wall').forEach(el => el.remove());

    walls.forEach(w => {
      const el = document.createElement('div');
      el.className = 'wall';
      el.style.width = (CELL - 1) + 'px';
      el.style.height = (CELL - 1) + 'px';
      el.style.left = (w.x * CELL) + 'px';
      el.style.top = (w.y * CELL) + 'px';
      board.appendChild(el);
    });

    snake.forEach((s, i) => {
      const el = document.createElement('div');
      el.style.width = (CELL - 2) + 'px';
      el.style.height = (CELL - 2) + 'px';
      el.style.left = (s.x * CELL + 1) + 'px';
      el.style.top = (s.y * CELL + 1) + 'px';

      if (i === 0) {
        el.className = 'snake-head';
        const eye1 = document.createElement('div');
        const eye2 = document.createElement('div');
        eye1.className = 'eye';
        eye2.className = 'eye';
        const tongue = document.createElement('div');
        tongue.className = 'tongue';

        if (dir.x === 1) {
          eye1.style.left = '11px'; eye1.style.top = '4px';
          eye2.style.left = '11px'; eye2.style.top = '11px';
          tongue.style.left = '17px'; tongue.style.top = '7px';
          tongue.style.transform = 'rotate(90deg)';
        } else if (dir.x === -1) {
          eye1.style.left = '3px'; eye1.style.top = '4px';
          eye2.style.left = '3px'; eye2.style.top = '11px';
          tongue.style.left = '-3px'; tongue.style.top = '7px';
          tongue.style.transform = 'rotate(90deg)';
        } else if (dir.y === -1) {
          eye1.style.left = '4px'; eye1.style.top = '3px';
          eye2.style.left = '11px'; eye2.style.top = '3px';
          tongue.style.left = '7px'; tongue.style.top = '-4px';
        } else {
          eye1.style.left = '4px'; eye1.style.top = '11px';
          eye2.style.left = '11px'; eye2.style.top = '11px';
          tongue.style.left = '7px'; tongue.style.top = '16px';
        }

        el.appendChild(eye1);
        el.appendChild(eye2);
        el.appendChild(tongue);
      } else {
        el.className = 'snake-body';
      }

      board.appendChild(el);
    });

    const foodEl = document.createElement('div');
    foodEl.className = 'fruit ' + food.type;
    foodEl.style.width = (CELL - 4) + 'px';
    foodEl.style.height = (CELL - 4) + 'px';
    foodEl.style.left = (food.x * CELL + 2) + 'px';
    foodEl.style.top = (food.y * CELL + 2) + 'px';
    board.appendChild(foodEl);

    statusEl.textContent = `Score: ${score} | High Score: ${highScore}`;
  }

  function setDirection(nx, ny) {
    if (dir.x === -nx && dir.y === -ny) return;
    nextDir = { x: nx, y: ny };
  }

  function tick() {
    dir = nextDir;
    const head = snake[0];
    const newHead = { x: head.x + dir.x, y: head.y + dir.y };

    if (walls.some(w => w.x === newHead.x && w.y === newHead.y)) {
      return endGame();
    }
    if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
      return endGame();
    }

    snake.unshift(newHead);

    if (newHead.x === food.x && newHead.y === food.y) {
      score += food.points;
      if (score > highScore) highScore = score;
      food = randomFood(snake);
    } else {
      snake.pop();
    }

    render();
  }

  function endGame() {
    running = false;
    clearInterval(loop);
    overlay.classList.remove('hidden');
    overlay.innerHTML = '<div id="gameOverText">Game Over!</div><button class="action" id="startBtn2">Play Again</button>';
    document.getElementById('startBtn2').addEventListener('click', startGame);
  }

  function startGame() {
    walls = generateWalls();
    snake = [{ x: 8, y: 8 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    food = randomFood(snake);
    score = 0;
    running = true;
    overlay.classList.add('hidden');
    render();
    clearInterval(loop);
    loop = setInterval(tick, 140);
  }

  startBtn.addEventListener('click', startGame);

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;
    }
  });

  document.getElementById('up').addEventListener('click', () => setDirection(0, -1));
  document.getElementById('down').addEventListener('click', () => setDirection(0, 1));
  document.getElementById('left').addEventListener('click', () => setDirection(-1, 0));
  document.getElementById('right').addEventListener('click', () => setDirection(1, 0));

  walls = generateWalls();
  snake = [{ x: 8, y: 8 }];
  food = randomFood(snake);
  score = 0;
  render();
</script>
</body>
</html>
