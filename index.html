<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Arena</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/snake-game/manifest.json">
<link rel="stylesheet" href="style.css">
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/snake-game/service-worker.js", { scope: "/snake-game/" });
  }
</script>
</head>
<body>
  <div id="topBar">
    <h1>🐍 Snake Arena</h1>
    <div id="scoreBoard">
      <span>Score: <b id="score">0</b></span>
      <span>Alive: <b id="aliveCount">20</b>/20</span>
    </div>
    <button id="pauseBtn">⏸</button>
  </div>

  <div id="leaderboard"></div>

  <canvas id="gameCanvas"></canvas>

  <div id="overlay">
    <h2 id="overlayTitle">Snake Arena</h2>
    <p id="overlayText"></p>
    <div id="btnRow">
      <button id="startBtn">Play</button>
      <button id="restartBtn" style="display:none;">Restart</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
